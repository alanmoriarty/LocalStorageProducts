<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center my-3">
        <h1>Listado de Productos</h1>
        <div>
            <span class="me-3 text-muted" id="welcomeMsg"></span>
            <button class="btn btn-outline-danger btn-sm" id="logoutBtn">Cerrar sesión</button>
        </div>
    </div>

    <form id="productForm" class="mb-4">
        <input type="hidden" id="editIndex">
        <div class="mb-3">
            <label class="form-label">Nombre Producto</label>
            <input type="text" class="form-control" id="nombre" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" class="form-control" id="precio" min="0" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control" id="cantidad" min="0" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Agregar</button>
        <button type="button" class="btn btn-secondary d-none" id="cancelBtn">Cancelar</button>
    </form>

    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="productTable"></tbody>
    </table>
</div>

<script src="localStorage.js"></script>
</body>
</html>
