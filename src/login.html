<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">

<div class="card shadow p-4" style="width: 360px;">
    <h4 class="text-center mb-4" id="formTitle">Iniciar Sesión</h4>

    <div id="alertBox" class="alert d-none" role="alert"></div>

    <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control" id="username" placeholder="Tu usuario">
    </div>
    <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="Tu contraseña">
    </div>

    <button class="btn btn-primary w-100 mb-2" id="actionBtn">Ingresar</button>
    <button class="btn btn-link w-100" id="toggleBtn">¿No tienes cuenta? Regístrate</button>
</div>

<script src="auth.js"></script>
</body>
</html>
